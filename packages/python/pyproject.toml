[build-system]
requires = ['flit_core>=3.2']
build-backend = 'flit_core.buildapi'

[project]
name = 'twitch-regex'
version = '0.1.0'
description = 'Regular expressions for Twitch clips, videos, channels and collections links'
keywords = ['regex', 'regexp', 'regular expressions', 'twitch']
license = { text = 'MIT' }
requires-python = '>=3.9'

[project.urls]
Homepage = 'https://github.com/DmitryScaletta/twitch-regex'
